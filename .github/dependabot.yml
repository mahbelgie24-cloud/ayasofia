version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Jerusalem
    versioning-strategy: increase
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
      supabase:
        patterns:
          - "@supabase/*"
      drizzle:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
          - "pg"
          - "@types/pg"
      testing:
        patterns:
          - "vitest"
          - "@playwright/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tw-animate-css"
    labels:
      - dependencies
      - npm
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 2
