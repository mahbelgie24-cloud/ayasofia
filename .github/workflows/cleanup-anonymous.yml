name: Anonymous User Cleanup

on:
  schedule:
    # Weekly dry-run — Monday 03:00 UTC.  Checks accumulation without
    # deleting anything.  Review results, run manual dispatch with
    # execute=true when ready.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      execute:
        description: "Actually delete users (uncheck for dry-run)"
        type: boolean
        default: false
      retention_hours:
        description: "Max age in hours before a user is eligible"
        type: string
        default: "24"

permissions:
  contents: read

jobs:
  cleanup:
    name: Cleanup Anonymous Users
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci --ignore-scripts avoids running husky prepare in CI
      # where git hooks are unnecessary and may fail.
      - run: npm ci --ignore-scripts

      - name: Dry-Run Cleanup
        if: ${{ !inputs.execute }}
        run: npm run cleanup:anonymous
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANONYMOUS_USER_MAX_AGE_HOURS: ${{ inputs.retention_hours }}

      - name: Execute Cleanup
        if: ${{ inputs.execute }}
        run: npm run cleanup:anonymous -- --execute
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANONYMOUS_USER_MAX_AGE_HOURS: ${{ inputs.retention_hours }}
