name: Anonymous User Cleanup

on:
  schedule:
    - cron: "0 3 * * *" # Daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no deletions)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    name: Cleanup Anonymous Users
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Dry-run cleanup
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm run cleanup:anonymous
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Execute cleanup (scheduled + manual execute)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: npm run cleanup:anonymous -- --execute
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
