name: CI

# P2-OPS-1 — CI Seed Gate.
#
# The `test` job runs the unit + integration suites against a *fresh*,
# migration-only Postgres 16 (no Supabase). To do that the service container
# must be made Supabase-shaped before the drizzle migrations can apply:
#
#   1. `.github/ci-ensure-role.mjs` mints the `authenticated` role that the RLS
#      policies reference, plus the `auth` schema + `auth.jwt()` used by the
#      policy USING clause (0003/0004).
#   2. `drizzle-kit migrate` applies the schema.
#   3. `npm run db:seed` seeds product/modifier/inventory data so the
#      integration suites have rows to work with.
#
# This guarantees the migrations AND the seed data are reproducible on a blank
# database in CI — not just on a developer's long-lived local/Supabase copy.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Static Analysis ──
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeCheck
        run: npm run typecheck

  # ── Unit + Integration Tests ──
  test:
    name: Tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-typecheck
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ayasofia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # P2-OPS-1: make the vanilla service container Supabase-shaped (role +
      # auth.jwt()) so the drizzle migrations apply on a fresh database.
      - name: Mint Supabase-shaped auth (role + auth.jwt)
        run: node .github/ci-ensure-role.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ayasofia_test

      - name: Run Drizzle Migrations
        run: npx drizzle-kit migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ayasofia_test

      # P2-OPS-1: seed product/modifier/inventory data the integration
      # suites rely on. The DB is a fresh, migration-only instance each run.
      - name: Seed database
        run: npm run db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ayasofia_test

      - name: Run Tests
        run: npx vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ayasofia_test

  # ── Build Check ──
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          DATABASE_URL: postgresql://placeholder

      # T-C2: keep the client bundle under budget (worst-case single gzip chunk
      # &lt;= 150 KB — a proxy for First Load JS, which Turbopack no longer prints).
      - name: Bundle budget
        run: node scripts/bundle-budget.mjs 150000

  # ── Result Gate ──
  result:
    name: CI Result
    if: always()
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, build]
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.lint-and-typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "❌ CI failed"
            exit 1
          fi
          echo "✅ CI passed"
