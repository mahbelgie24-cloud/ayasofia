<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Monochrome (black only, transparent background) reproduction of the
       actual Ayasofia logo mark — for thermal/print receipts where only
       black ink on white paper is available (spec §11.6). -->
  <!-- straw bending into an S shape -->
  <path d="M 118 20 L 138 48" stroke="#000000" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M 138 48 L 118 66" stroke="#000000" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M 118 66 L 108 96" stroke="#000000" stroke-width="11" stroke-linecap="round" fill="none"/>
  <!-- cup lid -->
  <rect x="58" y="92" width="100" height="15" rx="6" fill="#000000"/>
  <!-- cup body -->
  <path d="M 64 107 L 152 107 L 138 175 Q 136 184 126 184 L 90 184 Q 80 184 78 175 Z"
        fill="#FFFFFF" stroke="#000000" stroke-width="7"/>
  <!-- tapioca pearl dot grid (2 rows x 3) -->
  <circle cx="92" cy="150" r="6.5" fill="#000000"/>
  <circle cx="108" cy="150" r="6.5" fill="#000000"/>
  <circle cx="124" cy="150" r="6.5" fill="#000000"/>
  <circle cx="96" cy="165" r="6.5" fill="#000000"/>
  <circle cx="112" cy="165" r="6.5" fill="#000000"/>
  <circle cx="128" cy="165" r="6.5" fill="#000000"/>
</svg>
